<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0d0d0c;color:#d8d4c4;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:inherit;text-underline-offset:.2em}
.w{position:relative;width:min(100vw,calc(100vh * 1.7917));aspect-ratio:1376/768;container-type:inline-size;user-select:none;-webkit-user-select:none}
.bk{inset:.6cqw;background:#070706;border-radius:1.4cqw}
.w>img{position:relative;z-index:2;display:block;width:100%;height:100%;pointer-events:none}
.w>:not(img){position:absolute}
/* knobs */
.k{z-index:3;border-radius:50%;cursor:grab;touch-action:none;outline-offset:3px;box-shadow:0 .3cqw .7cqw rgba(0,0,0,.55)}
.k.d{cursor:grabbing}
.k img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.k .r{transition:transform .18s ease-out}
.k.d .r{transition:none}
.k:focus-visible,.t:focus-visible,.p:focus-visible{outline:2px solid #7dff4a}
/* toggles / power */
.t,.p{z-index:3;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.t{filter:drop-shadow(0 .2cqw .3cqw rgba(0,0,0,.5))}
.t svg{display:block;width:100%;height:100%;pointer-events:none}
.lv{transform-box:view-box;transform-origin:50px 52px;transition:transform .16s cubic-bezier(.3,1.3,.5,1)}
.t:not(.on) .lv{transform:scaleY(-1)} /* lever up = ON, down = OFF */
/* power: housing is fixed, only the rocker face tilts */
.p{perspective:140px;border-radius:.9cqw;padding:.55cqw;background:linear-gradient(150deg,#2e2e2e,#090909 60%);box-shadow:inset 0 0 0 .12cqw #3a3a3a,0 .25cqw .5cqw rgba(0,0,0,.6)}
.pf{display:flex;flex-direction:column;justify-content:space-between;align-items:center;width:100%;height:100%;padding:.7cqw 0;border-radius:.45cqw;color:#e6e6e6;font:600 1.5cqw/1 Arial,Helvetica,sans-serif;pointer-events:none;transition:transform .14s ease-out,background .14s;transform:rotateX(-13deg);background:linear-gradient(180deg,#2c2c2c,#171717 50%,#0a0a0a)}
.p.on .pf{transform:rotateX(13deg);background:linear-gradient(180deg,#0a0a0a,#171717 50%,#2c2c2c)}
.pf b{font-weight:600}
.w:not(.on) .p{animation:hint 2.2s ease-in-out infinite}
@keyframes hint{50%{filter:drop-shadow(0 0 .8cqw rgba(125,255,74,.9))}}
.w:not(.on) .k{filter:brightness(.6)}
.w:not(.on) .t{filter:drop-shadow(0 .2cqw .3cqw rgba(0,0,0,.5)) brightness(.6)}
.led{z-index:3;border-radius:50%;background:#2a0b08;box-shadow:inset 0 0 .3cqw #000;transition:.2s}
.led.g{background:#0c2a0a}
.led.r.lit{background:radial-gradient(#ffd9bd,#ff3a1a 55%,#a00);box-shadow:0 0 .9cqw .25cqw rgba(255,60,30,.75)}
.led.g.lit{background:radial-gradient(#e6ffd9,#46ff2a 55%,#0a8a08);box-shadow:0 0 .9cqw .25cqw rgba(70,255,40,.75)}
.jack{z-index:3;pointer-events:none;filter:drop-shadow(0 .25cqw .35cqw rgba(0,0,0,.5))}
.jack img{position:absolute;inset:0;width:100%;height:100%}
.cr{z-index:3;display:flex;align-items:center;justify-content:center;white-space:nowrap;font:500 .95cqw/1 "Arial Narrow","Helvetica Neue",Arial,sans-serif;letter-spacing:.1em;color:#1b1a17;pointer-events:none}
/* screen */
.scr{z-index:4;overflow:hidden;border-radius:1.6cqw;background:radial-gradient(ellipse at 50% 45%,#2b3a2c,#243126 70%,#1d281f);box-shadow:inset 0 0 2.4cqw rgba(0,0,0,.65),0 0 0 .15cqw #020403;color:#7dff4a;font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Apple SD Gothic Neo","Noto Sans KR",monospace;text-shadow:0 0 .5cqw rgba(110,255,60,.75);filter:brightness(calc(.55 + var(--int,.7)*.75))}.gr{position:absolute;inset:0;width:100%;height:100%;display:block}
.sc{z-index:5;width:1.5cqw;height:1.5cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bdbaae,#74716a 55%,#3a3934);box-shadow:0 .1cqw .25cqw rgba(0,0,0,.7),inset 0 0 0 .08cqw rgba(0,0,0,.4);pointer-events:none}
.sc::before,.sc::after{content:"";position:absolute;left:50%;top:50%;background:#1b1a17;border-radius:.1cqw;transform:translate(-50%,-50%) rotate(var(--r,0deg))}
.sc::before{width:64%;height:15%}.sc::after{width:15%;height:64%}
.scr::before{content:"";position:absolute;inset:0;background:#04100a;opacity:.95;transition:opacity .5s;z-index:5;pointer-events:none}
.scr::after{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
.on .scr::before{opacity:0}
.on .scr{animation:boot .8s ease-out}
@keyframes boot{0%{filter:brightness(0);transform:scaleY(.02)}30%{filter:brightness(2.4);transform:scaleY(.04)}60%{filter:brightness(1.8);transform:scaleY(1)}100%{transform:none}}
.sel{position:absolute;left:50%;top:4%;white-space:nowrap;transform:translateX(-50%);text-align:center;font-size:.95cqw;letter-spacing:.2em;opacity:.85}
.sk{width:2.6cqw;height:2.6cqw;margin:.3cqw auto 0;border:.1cqw solid currentColor;border-radius:50%;position:relative;transition:transform .2s}
.sk::after{content:"";position:absolute;left:50%;top:6%;width:.1cqw;height:32%;background:currentColor;transform:translateX(-50%)}
#info{position:absolute;left:4%;right:4%;top:19%;height:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:.35cqw}
#info>*{animation:ty .5s steps(20) both}
@keyframes ty{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
.ti{font-size:5cqw;font-weight:700;letter-spacing:.2em;padding-left:.2em}
.su{font-size:1.4cqw;letter-spacing:.3em}
.hd{font-size:1.65cqw;letter-spacing:.15em;margin-bottom:.4cqw}
.sb{font-size:1.5cqw;letter-spacing:.15em;margin-bottom:.4cqw}
.ln{font-size:1.5cqw}
.hz,.cl,#trk{position:absolute}
.hz{left:0;right:0;top:75%;border-top:1px solid rgba(110,255,60,.35)}
.cl{left:50%;top:75%;height:22%;border-left:1px dashed rgba(110,255,60,.35)}
#cv{position:absolute;left:0;top:76%;width:100%;height:18%}
#trk{left:0;right:0;bottom:2.5%;text-align:center;font-size:1.2cqw;letter-spacing:.15em}
/* plain content (mobile portrait / no-JS) + footer */
.plain{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{display:none;font-size:.85rem;opacity:.7;margin:.6rem 1rem 0;text-align:center}
footer{font-size:.8rem;opacity:.65;padding:.5rem 1rem;text-align:center}
@media (max-aspect-ratio:1/1){.plain{position:static;width:auto;height:auto;clip:auto;white-space:normal;margin:1rem 1.25rem;max-width:34rem}.plain h1{font-size:1.6rem;margin:.2rem 0}.hint{display:block}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(()=>{
"use strict";
/* ===== EDIT HERE: screen contents. [text, url] = link, [[t,u],[t,u]] = several links on one line ===== */
const PAGES={
 about:[{h:"ABOUT",l:["NUYH Creative is an independent studio","making multimedia art across","music, sound, visual and games.","음악, 사운드, 비주얼, 게임을 아우르는","멀티미디어 아트 스튜디오입니다."]},
        {h:"ABOUT",s:"MUSIC & SOUND",l:["Composition and sound design.","작곡과 사운드 디자인."]},
        {h:"ABOUT",s:"VISUAL",l:["Multimedia work.","COMING SOON"]},
        {h:"ABOUT",s:"GAME",l:["Independent game development.","Home of GOTBOY.","독립 게임 개발."]}],
 works:[{h:"WORKS",l:["Works by NUYH Creative","in music, visual and games.","음악, 비주얼, 게임 작품을 소개합니다."]},
        {h:"WORKS",s:"MUSIC & SOUND",l:["COMING SOON"]},
        {h:"WORKS",s:"VISUAL",l:["COMING SOON"]},
        {h:"WORKS",s:"GAME",l:["GOTBOY","Retro pixel-art runner & boss fight game",["gotboy.nuyhcreative.com","https://gotboy.nuyhcreative.com"]]}],
 store:[{h:"STORE",l:["Official goods from NUYH Creative:","music goods and game goods.","음원 굿즈와 게임 굿즈를 소개합니다."]},
        {h:"STORE",s:"MUSIC GOODS",l:["COMING SOON"]},
        {h:"STORE",s:"GAME GOODS",l:["GOTBOY goods.","COMING SOON"]}],
 contact:[{h:"CONTACT",l:[["contact@nuyhcreative.com","mailto:contact@nuyhcreative.com"]]}]
};
const TRACKS=["assets/track01.mp3","assets/track02.mp3","assets/track03.mp3"]; // put your audio files here
/* ================================================================ */
/* toggle art (vector) + screen grid */
const TG='<svg viewBox="0 0 100 128" aria-hidden="true"><polygon points="50,10 86.4,31 86.4,73 50,94 13.6,73 13.6,31" fill="url(#gNut)" stroke="#34332e"/><polygon points="50,14 82.9,33 82.9,71 50,90 17.1,71 17.1,33" fill="none" stroke="rgba(255,255,255,.35)"/><circle cx="50" cy="52" r="31" fill="url(#gRing)" stroke="#3a3934"/><circle cx="50" cy="52" r="27" fill="none" stroke="rgba(255,255,255,.25)"/><circle cx="50" cy="52" r="22" fill="url(#gWell)"/><circle cx="50" cy="52" r="11" fill="url(#gBall)"/><g filter="url(#tsh)"><g class="lv"><path d="M43.8 52L45.6 20Q45.8 12 50 12Q54.2 12 54.4 20L56.2 52Z" fill="url(#gLev)"/><ellipse cx="47.9" cy="21" rx="1.7" ry="5" fill="rgba(255,255,255,.28)"/></g></g></svg>';
document.querySelectorAll(".t").forEach(b=>b.innerHTML=TG);
(()=>{ const W=744,H=466,C=12,R=8,cw=W/C,rh=H/R; let d="",t="",o="";
  for(let i=1;i<C;i++) d+=`M${i*cw} 0V${H}`; for(let j=1;j<R;j++) d+=`M0 ${j*rh}H${W}`;
  for(let x=0;x<=W;x+=cw/5) t+=`M${x} ${H/2-5}V${H/2+5}`; for(let y=0;y<=H;y+=rh/5) t+=`M${W/2-6} ${y}H${W/2+6}`;
  for(const j of [1,6]) for(let i=0;i<C;i++) for(let k=0;k<4;k++) o+=`M${i*cw+cw*.2+k*cw*.2} ${(j+.5)*rh}h1.4`;
  document.getElementById("scr").insertAdjacentHTML("afterbegin",`<svg class="gr" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><g stroke="#04100a" fill="none"><path d="${d}" stroke-width="1.6"/><path d="${t}" stroke-width="1.4"/><path d="${o}" stroke-width="1.6" stroke-linecap="round"/></g></svg>`);
})();
const $=s=>document.querySelector(s), clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const S={on:0,wave:1,music:0,page:null,sub:{about:0,works:0,store:0},tr:0,bad:0}, V={int:.5,zoom:.5,vol:.5};
const SEC=["about","works","store","contact"], POS={aboutp:"about",worksp:"works",storep:"store"};
const wrap=$("#w"),info=$("#info"),trk=$("#trk"),sk=$("#sk"),cv=$("#cv"),ctx=cv.getContext("2d");
const aud=new Audio(); aud.loop=true; aud.preload="none"; aud.volume=V.vol;
let AC,an,buf;

/* ---- screen text ---- */
function show(){
  info.replaceChildren(); $("#sel-t").textContent=Object.values(POS).includes(S.page)?"SELECT POSITION":"SELECT"; // CONTACT has no position knob
  if(!S.on) return;
  const rows=[];
  if(!S.page){ rows.push(["ti","NUYH"],["su","MUSIC / SOUND / VISUAL / GAME"]); }
  else{
    const list=PAGES[S.page], p=list[Math.min(S.sub[S.page]|0,list.length-1)];
    rows.push(["hd","▶ "+p.h]); if(p.s) rows.push(["sb",p.s]); p.l.forEach(x=>rows.push(["ln",x]));
  }
  rows.forEach(([c,x],i)=>{
    const d=document.createElement("div"); d.className=c; d.style.animationDelay=(i*.14)+"s";
    if(Array.isArray(x)){ (Array.isArray(x[0])?x:[x]).forEach((l,j)=>{ if(j) d.append(" · "); const a=document.createElement("a"); a.href=l[1]; a.textContent=l[0]; a.rel="noopener"; if(l[1].startsWith("http")) a.target="_blank"; d.append(a); }); }
    else d.textContent=x;
    info.append(d);
  });
  sk.style.transform="rotate("+(45*(S.sub[S.page]|0))+"deg)";
}
function label(){ const n="TRACK 0"+(S.tr+1); trk.textContent=S.on?(S.bad&&S.music?n+" — NO SIGNAL":"▶ "+n):""; }
function leds(){
  const on=S.on;
  $("#l-power").classList.toggle("lit",!!on);
  $("#l-wave").classList.toggle("lit",!!(on&&S.wave));
  $("#l-music").classList.toggle("lit",!!(on&&S.music));
}

/* ---- audio ---- */
function loadTrack(){
  S.bad=0; aud.src=TRACKS[S.tr]; label();
  if(S.on&&S.music) aud.play().catch(()=>{S.bad=1;label();});
}
aud.addEventListener("error",()=>{S.bad=1;label();});
function setMusic(v){
  S.music=v?1:0; $("#t-music").classList.toggle("on",!!S.music); $("#t-music").setAttribute("aria-pressed",!!S.music);
  if(S.music&&S.on){
    if(!aud.src) aud.src=TRACKS[S.tr];
    try{ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); const s=AC.createMediaElementSource(aud); an=AC.createAnalyser(); an.fftSize=1024; s.connect(an); an.connect(AC.destination); buf=new Uint8Array(an.fftSize);} if(AC.state==="suspended") AC.resume(); }catch(e){ an=null; }
    aud.play().catch(()=>{S.bad=1;label();});
  } else aud.pause();
  leds(); label();
}

/* ---- knobs (angle in degrees, 0 = north) ---- */
const K={}, ST={aboutp:[0,45,90,135],worksp:[0,45,90,135],storep:[0,45,90],track:[0,45,90]};
function change(id,a){
  const v=(a+135)/270, st=ST[id];
  if(id==="int"){V.int=v; wrap.style.setProperty("--int",v); return;}
  if(id==="zoom"){V.zoom=v; return;}
  if(id==="vol"){V.vol=v; aud.volume=v; return;}
  const i=st?st.indexOf(a):0;
  if(id==="track"){S.tr=i; loadTrack(); return;}
  const reset=o=>{ S.sub[o]=0; if(K[o+"p"]) K[o+"p"].set(0,1); }; // position knob back to 0
  if(id in POS){ if(S.page!==POS[id]){ K[id].set(0,1); return; } S.sub[POS[id]]=i; show(); return; } // only the active section's position knob works
  if(a>20){ SEC.forEach(o=>{ if(o!==id){ K[o].set(0,1); reset(o); } }); S.page=id; } else if(S.page===id){ S.page=null; reset(id); }
  show();
}
document.querySelectorAll(".k").forEach(el=>{
  const id=el.dataset.k, st=ST[id], sec=SEC.includes(id), rot=el.querySelector(".r");
  const k=K[id]={a:0,
    set(a,quiet){
      a=clamp(a,-135,135);
      if(st) a=st.reduce((b,s)=>Math.abs(s-a)<Math.abs(b-a)?s:b);
      this.a=a; rot.style.transform="rotate("+a+"deg)"; el.setAttribute("aria-valuenow",Math.round((a+135)/2.7));
      if(!quiet) change(id,a);
    },
    step(d,wrapAround){
      if(!st) return this.set(this.a+d*12);
      let i=st.indexOf(this.a)+d; i=wrapAround?(i+st.length)%st.length:clamp(i,0,st.length-1); this.set(st[i]);
    }};
  let p=null;
  el.addEventListener("pointerdown",e=>{ if(!S.on) return; el.setPointerCapture(e.pointerId); el.classList.add("d"); p={x:e.clientX,y:e.clientY,m:0}; });
  el.addEventListener("pointermove",e=>{
    if(!p) return;
    if(Math.hypot(e.clientX-p.x,e.clientY-p.y)>5) p.m=1;
    if(!p.m) return;
    const r=el.getBoundingClientRect(), a=Math.atan2(e.clientX-(r.left+r.width/2),-(e.clientY-(r.top+r.height/2)))*180/Math.PI;
    if(Math.abs(a)<=155) k.set(a);
  });
  const end=()=>{ if(!p) return; if(!p.m){ if(sec) k.set(k.a>20?0:45); else if(st) k.step(1,true); } el.classList.remove("d"); p=null; };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
  el.addEventListener("wheel",e=>{ if(!S.on) return; e.preventDefault(); k.step(e.deltaY<0?1:-1); },{passive:false});
  el.addEventListener("keydown",e=>{
    if(!S.on) return; const d={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1}[e.key]; if(!d) return;
    e.preventDefault(); k.step(d);
  });
  k.set(0,1);
});
wrap.style.setProperty("--int",V.int);

/* ---- toggles / power ---- */
$("#t-wave").classList.add("on"); $("#t-wave").setAttribute("aria-pressed","true");
$("#t-wave").onclick=()=>{ if(!S.on) return; S.wave^=1; $("#t-wave").classList.toggle("on",!!S.wave); $("#t-wave").setAttribute("aria-pressed",!!S.wave); leds(); };
$("#t-music").onclick=()=>{ if(S.on) setMusic(!S.music); };
$("#power").onclick=()=>{
  S.on^=1; wrap.classList.toggle("on",!!S.on);
  const p=$("#power"); p.classList.toggle("on",!!S.on); p.setAttribute("aria-pressed",!!S.on);
  if(!S.on){ aud.pause(); ctx.clearRect(0,0,cv.width,cv.height);
    S.page=null; SEC.forEach(o=>{ K[o].set(0,1); S.sub[o]=0; if(K[o+"p"]) K[o+"p"].set(0,1); });
    ["int","zoom","vol","track"].forEach(o=>K[o].set(0,1)); // INTENSITY/ZOOM/VOLUME/TRACK back to center
    V.int=V.zoom=V.vol=.5; wrap.style.setProperty("--int",.5); aud.volume=.5;
    if(S.tr){ S.tr=0; aud.src=TRACKS[0]; }
    setMusic(0); S.wave=1; $("#t-wave").classList.add("on"); $("#t-wave").setAttribute("aria-pressed","true"); // MUSIC off, WAVE on (initial)
  } // power off = reset everything
  else if(S.music) setMusic(1);
  leds(); show(); label();
};

/* ---- waveform ---- */
function fit(){ const d=Math.min(devicePixelRatio||1,2); cv.width=cv.clientWidth*d; cv.height=cv.clientHeight*d; }
new ResizeObserver(fit).observe(cv); fit();
const gen=(x,t)=>{ let e=0; for(let k=0;k<4;k++){ const c=((k*.27+t*.03+.1)%1.2)-.1; e+=Math.exp(-((x-c)**2)/.004); } return Math.sin(x*140+t*3)*(.12+e)*Math.sin(x*37-t)*.9; };
function frame(ms){
  requestAnimationFrame(frame);
  if(document.hidden||!S.on||!S.wave){ if(cv.dataset.c!=="1"){ctx.clearRect(0,0,cv.width,cv.height); cv.dataset.c="1";} return; }
  cv.dataset.c="0";
  const w=cv.width,h=cv.height,mid=h/2,amp=(.35+V.zoom*1.3)*h*.42,t=ms/1000,n=Math.min(w,500);
  const live=an&&S.music&&!aud.paused&&!S.bad; if(live) an.getByteTimeDomainData(buf);
  ctx.clearRect(0,0,w,h); ctx.beginPath();
  for(let i=0;i<=n;i++){ const x=i/n, y=live?(buf[(x*(buf.length-1))|0]-128)/128:gen(x,t); ctx[i?"lineTo":"moveTo"](x*w,mid+y*amp); }
  ctx.lineWidth=Math.max(1.5,w/700); ctx.strokeStyle="#8dff5a"; ctx.shadowColor="#5cff2a"; ctx.shadowBlur=w/120; ctx.stroke();
}
requestAnimationFrame(frame);
label(); leds();
})();
</script>
